# ── Networks ────────────────────────────────────────────────────────────────
# easypanel: shared network — lets the backend App service reach these containers
# local:     internal-only network for local docker compose usage
networks:
  easypanel:
    external: true
  local:
    driver: bridge

volumes:
  docai-postgres-data:
  docai-minio-data:

services:
  postgres:
    image: postgres:16-alpine
    container_name: docai-postgres
    networks:
      - easypanel
      - local
    environment:
      POSTGRES_DB: docai
      POSTGRES_USER: docai
      POSTGRES_PASSWORD: docai
    ports:
      - "5432:5432"
    volumes:
      - docai-postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docai -d docai"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: docai-redis
    networks:
      - easypanel
      - local
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: docai-minio
    command: server /data --console-address ":9001"
    networks:
      - easypanel
      - local
    environment:
      MINIO_ROOT_USER: docai-local
      MINIO_ROOT_PASSWORD: docai-local-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - docai-minio-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5